[package]
name = "polystore"
version = "0.1.0"
edition = "2024"
authors = ["Anatta <noreply@anatta.dev>"]
license = "Apache-2.0"
description = "Triad storage abstraction — GraphStore + KvStore + VectorStore traits for Rust"
repository = "https://github.com/anatta-rs/polystore"
readme = "README.md"
keywords = ["storage", "graph", "key-value", "vector", "abstraction"]
categories = ["database", "data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pretty_assertions = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
