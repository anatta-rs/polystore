# release-plz configuration
# Docs: https://release-plz.dev/docs/config

[workspace]
# We pin via git tag (not crates.io), so don't publish.
publish = false

# Create a GitHub release when a release PR is merged.
git_release_enable = true
git_release_type = "auto"

# Generate / maintain CHANGELOG.md from conventional commits.
changelog_update = true

# Don't run cargo-semver-checks (needs crates.io baseline; we publish elsewhere).
semver_check = false

# Pre-1.0: every breaking change bumps minor; new features bump patch.
# release-plz reads conventional commit prefixes:
#   feat!      / BREAKING CHANGE  → minor (until 1.0, then major)
#   feat       → patch (until 1.0, then minor)
#   fix        → patch
#   chore/docs → no bump unless flagged
[changelog]
# Keep CHANGELOG.md in standard "Keep a Changelog" format.
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """

## [{{ version | trim_start_matches(pat="v") }}]\
  {%- if release_link -%}\
    ({{ release_link }})\
  {% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
    {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^ci", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "Breaking changes" },
]
filter_commits = false
